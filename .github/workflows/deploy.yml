name: Build and Deploy

on:
  push:
    branches: ['main']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Lint
        run: |
          pnpm install
          pnpm run lint

      # 存量类型错误较多（vendor 代码），先非阻塞展示，后续逐步清零
      - name: Typecheck
        run: pnpm run typecheck
        continue-on-error: true

      - name: Build
        run: pnpm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          personal_token: ${{ secrets.DEPLOY }}
          publish_dir: ./dist
